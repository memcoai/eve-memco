name: System test

# Real eve agents against a real model and a dedicated Memco test org: what the
# unit tests cannot see, as they call the provider directly. Apart from ci.yaml,
# which also runs on every push: here that would pay for each pull request twice.
on:
  pull_request:
    # Root files only: the examples' agent/instructions.md is the agent's prompt,
    # which a system test does have to cover.
    paths-ignore:
      - '*.md'
      - LICENSE
  # The release pipeline calls this, and a release must not publish without it.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Prefixed, as in ci.yaml. Only a pull request's run gives way to a newer one.
  group: system-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate, ${{ matrix.mode }}
    # A fork gets no secrets. Only a pull request skips: the release pipeline
    # has no such exit, so missing secrets stop it rather than wave it through.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Holds the secrets, so no other job in the repository can read them. They
    # belong to the test org: this job runs the code of the branch under test.
    environment: system-test
    timeout-minutes: 20
    # One run per mode across every branch: they share the test org. GitHub keeps
    # one run waiting per group, so a newer one replaces it.
    concurrency:
      group: system-test-${{ matrix.mode }}
      cancel-in-progress: false
    strategy:
      # One mode failing says nothing about the other.
      fail-fast: false
      matrix:
        mode: [single, multi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make examples

      # The driver hands each mode only its own Memco credential, and refuses
      # to start without it.
      - name: Validate
        run: make validate MODE=${{ matrix.mode }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEMCO_API_TOKEN: ${{ secrets.MEMCO_API_TOKEN }}
          MEMCO_CLIENT_ID: ${{ secrets.MEMCO_CLIENT_ID }}
          MEMCO_CLIENT_SECRET: ${{ secrets.MEMCO_CLIENT_SECRET }}
          # The first session builds the sandbox image on a fresh runner.
          VALIDATE_TURN_SECONDS: '300'
          # The samples only report, and they are most of the time and most of
          # what piles up in the test org.
          VALIDATE_SAMPLES: '0'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validate-${{ matrix.mode }}
          path: examples/results/
          if-no-files-found: ignore
